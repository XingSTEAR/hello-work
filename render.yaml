services:
  - type: web
    name: hello-work
    env: node
    region: singapore
    plan: free
    buildCommand: |
      cd client && npm install && npm run build && cd ..
      mkdir -p server/public && cp -rf client/dist/* server/public/
      cd server && npm install && npx prisma generate && npx prisma db push && npx tsx prisma/seed.ts && npm run build
    startCommand: cd server && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
    autoDeploy: true
